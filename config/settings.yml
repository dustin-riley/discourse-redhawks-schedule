plugins:
  redhawks_schedule_enabled:
    default: true
    client: true
  redhawks_schedule_feed_url:
    default: "https://miamiredhawks.com/calendar.ashx/calendar.rss"
  redhawks_gameday_enabled:
    default: false
  redhawks_gameday_poster_username:
    default: "swoop_bot"
  redhawks_gameday_sports:
    type: objects
    default: []
    schema:
      name: sport
      # Without this, core's editor labels every row `${schema.name} ${index+1}`
      # -- "sport 1", "sport 2" -- so the nav tree gives no way to tell which
      # sport a row is. `identifier` makes each row show its own sport name.
      identifier: sport
      properties:
        sport:
          type: string
          required: true
        mode:
          # Deliberately not `required`. Core's enum field renders `default` but
          # never writes it to the object, so a required `mode` the admin never
          # opened is stored as absent and rejects the whole setting on save.
          # Non-required saves clean, and the planner reads a blank mode as off.
          type: enum
          default: "off"
          choices:
            - "thread"
            - "digest"
            - "off"
        category:
          type: categories
          required: true
          validations:
            max: 1
        days_before:
          type: integer
          validations:
            min: 0
            max: 14
        digest_day:
          type: enum
          default: "Monday"
          choices:
            - "Monday"
            - "Tuesday"
            - "Wednesday"
            - "Thursday"
            - "Friday"
            - "Saturday"
            - "Sunday"
